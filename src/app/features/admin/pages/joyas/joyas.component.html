<div class="page-content">
  <div class="header">
    <h1>Precio de Oro en Joyas</h1>
    <p>Precios calculados por quilataje (24K - 10K)</p>
  </div>

  <p-card>
    <p-table stripedRows [value]="karatData()" [responsiveLayout]="'scroll'" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Quilate (Klt)</th>
          <th>Pureza (%)</th>
          <th>Precio Gramo -6% (BOB)</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td><span class="font-bold">{{ item.karat }}K</span></td>
          <td>{{ item.purity | number:'1.2-2' }}%</td>
          <td><span class="text-primary font-bold">{{ item.price | number:'1.2-2' }} BOB</span></td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
