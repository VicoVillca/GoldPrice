<div class="main-layout" [class.dark-theme]="themeService.isDarkMode" [class.light-theme]="!themeService.isDarkMode">
  
  <!-- Sidebar web -->
  <div class="sidebar-container" *ngIf="!isMobile">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Sidebar móvil personalizado -->
  <div *ngIf="isMobile && mobileSidebarVisible" class="mobile-sidebar-overlay" (click)="closeMobileSidebar()"></div>

  <div *ngIf="isMobile && mobileSidebarVisible" class="mobile-sidebar">
<app-sidebar (toggleSidebar)="closeMobileSidebar()"></app-sidebar>
  </div>

  <!-- Main Content Area -->
  <div class="main-content-area" [class.sidebar-visible]="!isMobile">
    
    <!-- Toolbar con botón para móviles -->
    <app-toolbar 
      [title]="pageTitle"
      [showMobileMenu]="isMobile"
      (toggleMobileSidebar)="toggleMobileSidebar()"
    ></app-toolbar>

    <!-- Content -->
    <main class="content-wrapper">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="footer-container">
        <div class="footer-brand">
          <a href="#" class="brand-badge">
            <i class="brand-icon pi pi-box"></i>
            <span>Vico-Proyectos</span>
          </a>
        </div>
      </div>
    </footer>
  </div>

  <p-toast position="top-right"></p-toast>
</div>
